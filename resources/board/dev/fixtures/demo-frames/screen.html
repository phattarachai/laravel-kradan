<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตะกร้า</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1d2127; }
  header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #e5e7eb; padding: 12px 16px; font-weight: 600; display: flex; justify-content: space-between; }
  main { padding: 16px; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  td, th { padding: 10px 12px; border-bottom: 1px solid #f0f1f3; text-align: left; }
  .cards { display: grid; gap: 10px; }
  .c { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; }
  a { color: #2563eb; }
  @media (max-width: 600px) { th:nth-child(3), td:nth-child(3) { display: none; } }
</style>
</head>
<body>
<header><span>ตะกร้า</span><a href="#s=detail">ดูรายละเอียด</a></header>
<main id="m"></main>
<script>
  const V = new URLSearchParams(location.search).get('v') || 'A';
  const rows = Array.from({ length: 40 }, (_, i) => ({ no: 'RRC' + String(212600 + i), cust: ['เหล็กไทย', 'สยามสตีล', 'ไทยเมทัล'][i % 3], amt: (12450 + i * 731).toLocaleString('th-TH') }));
  function render() {
    const s = new URLSearchParams(location.hash.slice(1)).get('s') || 'list';
    const m = document.getElementById('m');
    if (s === 'detail') { m.innerHTML = '<div class="c"><b>RRC212600</b><p>เหล็กไทย ยอด 12,450</p><a href="#s=list">กลับ</a></div>'; return; }
    m.innerHTML = V === 'A'
      ? '<table><tr><th>ตะกร้า</th><th>ลูกค้า</th><th>ยอด</th></tr>' + rows.map(r => `<tr><td>${r.no}</td><td>${r.cust}</td><td>${r.amt}</td></tr>`).join('') + '</table>'
      : '<div class="cards">' + rows.map(r => `<div class="c"><b>${r.no}</b><br>${r.cust} · ${r.amt}</div>`).join('') + '</div>';
  }
  addEventListener('hashchange', render);
  render();
</script>
</body>
</html>
